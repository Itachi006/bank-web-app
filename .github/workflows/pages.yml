name: Deploy live demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build static demo site
        run: |
          set -euo pipefail
          INDEX=$(find . -path '*/src/main/resources/static/index.html' -not -path './node_modules/*' | head -n 1)
          if [ -z "$INDEX" ]; then echo "::error::Could not find src/main/resources/static/index.html"; exit 1; fi
          STATIC_DIR=$(dirname "$INDEX")
          echo "Using $STATIC_DIR"

          mkdir _site
          cp -r "$STATIC_DIR"/. _site/
          cp pages-demo/demo-api.js _site/demo-api.js
          sed -i -E 's#(href|src)="/([^"/][^"]*)"#\1="\2"#g; s#href="/"#href="./"#g' _site/index.html
          sed -i 's#<script src="app.js"></script>#<script src="demo-api.js"></script><script src="app.js"></script>#' _site/index.html
          grep -q 'src="demo-api.js"' _site/index.html || { echo "::error::could not inject demo-api.js"; exit 1; }
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
